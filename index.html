<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>יפן 2026</title>
<meta name="theme-color" content="#f1f3f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141816" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600&family=Noto+Serif+JP:wght@600&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}

/* Layout: phone app. Each day opens with a landscape band in its region's color (maple Kyoto, cypress Kiso, lake Fuji...),
   then "fixed times" only for things that truly have an hour, then the places for the day as postcards. */
:root{
  --bg:#f1f3f0; --surface:#ffffff; --ink:#1e2723; --muted:#5d6964; --line:#dde3de;
  --gold:#a36f12; --gold-soft:#fbf1dc;
  --f-display:"Frank Ruhl Libre","David",serif; --f-body:"Rubik","Arial Hebrew",Arial,sans-serif; --f-jp:"Noto Serif JP","Yu Mincho",serif;
  --r:#5a6b8a; --rh:#4d5c78;
}
.rg-kyoto{--r:#b0442b;--rh:#9a3b25}
.rg-takayama{--r:#9a5b17;--rh:#8a5216}
.rg-kiso{--r:#376548;--rh:#2f5a3f}
.rg-fuji{--r:#2c6488;--rh:#285a7b}
.rg-hakone{--r:#3f7570;--rh:#376762}
.rg-tokyo{--r:#3d4b88;--rh:#36427a}
.rg-air{--r:#5a6b8a;--rh:#4d5c78}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#141816;--surface:#1d2320;--ink:#e8ece9;--muted:#a5b0ab;--line:#2e3632;--gold:#e6b65c;--gold-soft:#3a3020;color-scheme:dark}
  :root:not([data-theme="light"]) .rg-kyoto{--r:#f0927a}
  :root:not([data-theme="light"]) .rg-takayama{--r:#e3a85e}
  :root:not([data-theme="light"]) .rg-kiso{--r:#8cc79f}
  :root:not([data-theme="light"]) .rg-fuji{--r:#86bde0}
  :root:not([data-theme="light"]) .rg-hakone{--r:#8ccbc4}
  :root:not([data-theme="light"]) .rg-tokyo{--r:#a8b4ef}
  :root:not([data-theme="light"]) .rg-air{--r:#b3bdd6}
}
:root[data-theme="dark"]{--bg:#141816;--surface:#1d2320;--ink:#e8ece9;--muted:#a5b0ab;--line:#2e3632;--gold:#e6b65c;--gold-soft:#3a3020;color-scheme:dark}
:root[data-theme="dark"] .rg-kyoto{--r:#f0927a}
:root[data-theme="dark"] .rg-takayama{--r:#e3a85e}
:root[data-theme="dark"] .rg-kiso{--r:#8cc79f}
:root[data-theme="dark"] .rg-fuji{--r:#86bde0}
:root[data-theme="dark"] .rg-hakone{--r:#8ccbc4}
:root[data-theme="dark"] .rg-tokyo{--r:#a8b4ef}
:root[data-theme="dark"] .rg-air{--r:#b3bdd6}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;direction:rtl;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 100px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}
h2{font-size:19px;color:var(--ink)}
.muted{color:var(--muted)} .small{font-size:14px}
.mono{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.stack{display:flex;flex-direction:column;gap:14px}

/* demo bar */
.demo{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.demo select{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:#4caf7a;display:inline-block}.sync i.off{background:#d9822b}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:20px;background:var(--rh);color:#fff;min-height:210px;padding:18px 18px 20px;display:flex;flex-direction:column;justify-content:flex-end}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero > *:not(canvas){position:relative}
.hero .kanji{position:absolute;top:14px;left:16px;font-family:var(--f-jp);font-size:34px;line-height:1;writing-mode:vertical-rl;opacity:.9;letter-spacing:.1em}
.hero .meta{font-size:14px;opacity:.9}
.hero h1{font-size:30px;line-height:1.15;font-weight:900;margin-top:2px}
.hero .where{font-size:15px;opacity:.92;margin-top:4px}

/* fixed times */
.fixed{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.fx{display:flex;gap:12px;align-items:flex-start;padding-block:10px;border-top:1px solid var(--line)}
.fx:first-child{border-top:0}
.fx .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;color:var(--r);min-width:52px;direction:ltr;text-align:right}
.fx .w{flex:1;min-width:0}
.fx .n{font-size:14px;color:var(--muted)}
.remind{display:inline-block;margin-top:4px;font-size:13px;font-weight:500;color:var(--gold);background:var(--gold-soft);padding:2px 8px;border-radius:6px}

/* shabbat */
.shabbat{display:flex;gap:14px;align-items:center;background:var(--gold-soft);border-radius:16px;padding:14px 16px}
.shabbat .flame{width:34px;height:44px;flex:none}
.shabbat .lbl{font-size:14px;color:var(--gold);font-weight:600}
.shabbat .tm{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1}
.shabbat .n{font-size:14px;color:var(--muted)}

/* places */
.places{display:grid;gap:10px}
.place{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}
.place .pin{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--r) 14%,var(--surface));color:var(--r)}
.place .body{flex:1;min-width:0}
.place h3{font-size:18px}
.place p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.go{flex:none;font:500 14px var(--f-body);text-decoration:none;color:var(--surface);background:var(--r);padding:8px 14px;border-radius:999px}
.tag{display:inline-block;font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-inline-start:6px;vertical-align:2px}
.free{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:16px;color:var(--muted);text-align:center}

/* tonight */
.tonight{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.tonight .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.jp{font-family:var(--f-jp);font-size:17px;letter-spacing:.02em;margin-top:6px;overflow-wrap:anywhere}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;font:500 14px var(--f-body);padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:transparent;text-decoration:none;cursor:pointer}
.btn.solid{background:var(--r);border-color:var(--r);color:var(--surface)}
.btn:focus-visible,.go:focus-visible,.tab:focus-visible,.dayrow:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pager{display:flex;justify-content:space-between;gap:8px}

/* days list */
.region{margin-top:18px}
.region .rh{display:flex;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:2px solid var(--r)}
.region .rh .k{font-family:var(--f-jp);color:var(--r);font-size:20px}
.dayrow{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;width:100%;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.dayrow .d{font-variant-numeric:tabular-nums;font-weight:600;min-width:46px;color:var(--r)}
.dayrow .x{flex:1;min-width:0}
.dayrow.cur{background:color-mix(in srgb,var(--r) 10%,transparent);border-radius:10px}
.chip{font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold)}

/* cards for stay/tickets/more */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card .k{font-family:var(--f-jp);color:var(--r);font-size:22px;float:left;line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin:8px 0 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ticket{border-top:2px dashed var(--line);margin-top:12px;padding-top:12px;text-align:center}
.qr{width:150px;height:150px;display:block;margin:0 auto;image-rendering:pixelated;background:#fff;padding:8px;border-radius:8px}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

/* folds: tasks + check-in */
.fold{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:10px}
.fold summary{cursor:pointer;list-style:none;padding:10px 14px;font-weight:600;display:flex;align-items:center;gap:8px}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"";margin-inline-start:auto;width:8px;height:8px;border-left:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.fold[open] summary::after{transform:rotate(135deg)}
.fold summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:12px}
.fold > :not(summary){margin-inline:14px}
.fold > :last-child{margin-bottom:12px}
.tasks{margin-top:0;border-radius:16px}
.count{font-variant-numeric:tabular-nums;font-size:13px;min-width:22px;text-align:center;padding:1px 7px;border-radius:999px;background:var(--r);color:var(--surface)}
.trow{display:flex;gap:10px;align-items:flex-start;padding-block:8px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.trow:first-child{border-top:0}
.box{width:18px;height:18px;border:2px solid var(--muted);border-radius:50%;flex:none;margin-top:3px}
.box.p1{border-color:#d1453b}.box.p2{border-color:#eb8909}.box.p3{border-color:#246fe0}
.ci{padding-inline-start:18px;margin-block:0;font-size:15px;display:grid;gap:4px}
.btn.sm{padding:4px 10px;font-size:13px}

/* tabs */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{all:unset;text-align:center;padding:8px 2px 7px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer}
.tab svg{display:block;margin:0 auto 2px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--r)}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;z-index:9}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .2s ease-out}@keyframes fade{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main class="wrap" id="app">
  <div id="view" class="view"></div>
</main>

<nav class="tabs" aria-label="ניווט ראשי"><div class="in" role="tablist">
  <button class="tab" role="tab" data-t="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>היום</button>
  <button class="tab" role="tab" data-t="days"><svg viewBox="0 0 24 24"><path d="M3 18l6-9 4 6 3-4 5 7z"/></svg>המסלול</button>
  <button class="tab" role="tab" data-t="stay"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>לינה</button>
  <button class="tab" role="tab" data-t="tix"><svg viewBox="0 0 24 24"><path d="M4 7h16v4a2 2 0 000 4v4H4v-4a2 2 0 000-4z"/><path d="M14 7v12" stroke-dasharray="2 2"/></svg>כרטיסים</button>
  <button class="tab" role="tab" data-t="more"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM12 8v8M8 12h8"/></svg>עזרה</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
